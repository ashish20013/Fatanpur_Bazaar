name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two builds at once (HOSTING_CAPACITY) — and never build on the server.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fb_test
          MARIADB_USER: fb
          MARIADB_PASSWORD: fbpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      TZ: Asia/Kolkata
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: fb_test
      DB_USER: fb
      DB_PASSWORD: fbpass
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret-0123456789abcdef0123456789abcdef' }}
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcd
      APP_SECRET: ci-app-secret-0123456789abcdef0123456789abcdef01
      ALLOWED_ORIGINS: http://localhost:3001
      STORAGE_PATH: /tmp/fb-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check:no-spread
      - run: npm run build:types
      - run: npm run lint --workspace=apps/api
      - run: npm test
      - run: npm run build --workspace=apps/api

  web:
    needs: api                 # serial — never two builds in parallel
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=2048
      NEXT_PUBLIC_SITE_URL: https://fatanpurbazaar.com
      NEXT_PUBLIC_API_URL: https://api.fatanpurbazaar.com
      NEXT_PUBLIC_SOCKET_URL: https://api.fatanpurbazaar.com
      API_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_BUILD_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:types
      - run: npm run lint --workspace=apps/web
      - run: node scripts/make-release.mjs
      - uses: actions/upload-artifact@v4
        with: { name: api-release, path: release/api, retention-days: 7, include-hidden-files: true }
      - uses: actions/upload-artifact@v4
        with: { name: web-release, path: release/web, retention-days: 7, include-hidden-files: true }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [api, web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: api-release, path: api-dist }
      - uses: actions/download-artifact@v4
        with: { name: web-release, path: web-standalone }

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 65002 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy API
        env:
          R: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          P: -p ${{ secrets.SSH_PORT || 65002 }}
          DOMAIN: api.fatanpurbazaar.com
        run: |
          BASE="~/domains/$DOMAIN/hbuilds"
          VER="deploy-$(date +%Y%m%d-%H%M%S)"

          # 1. Create new version directory
          ssh $P $R "mkdir -p $BASE/versions/$VER/nodejs/tmp"

          # 2. Upload release files
          rsync -az --delete --exclude tmp -e "ssh $P" api-dist/ "$R:$BASE/versions/$VER/nodejs/"

          # 3. Setup .env symlink + storage symlink + npm install + migrate
          ssh $P $R "
            export PATH=/opt/alt/alt-nodejs24/root/usr/bin:\$PATH
            cd $BASE/versions/$VER/nodejs
            ln -sf $BASE/config/.env .env
            ln -sf ~/storage/fatanpur storage
            mkdir -p tmp
            npm install --omit=dev --no-audit --no-fund 2>&1 | tail -5
            node dist/cli.js migrate
          "

          # 3b. Deploy seed images + fix STORAGE_PATH + run seed
          ssh $P $R "
            export PATH=/opt/alt/alt-nodejs24/root/usr/bin:\$PATH
            cd $BASE/versions/$VER/nodejs
            SHARED=\$HOME/storage/fatanpur

            # Ensure shared storage directories exist
            mkdir -p \$SHARED/uploads/categories/seed \$SHARED/uploads/banners \$SHARED/uploads/products

            # Copy seed category images from release to shared storage (never overwrite existing)
            if [ -d storage-seed/uploads ]; then
              cp -rn storage-seed/uploads/* \$SHARED/uploads/ 2>/dev/null || true
            fi

            # One-time migration: if old absolute-path storage has files, copy them across
            OLD=\$HOME/domains/$DOMAIN/hbuilds/storage/uploads
            if [ -d \"\$OLD\" ] && [ ! -L \"\$OLD\" ]; then
              cp -rn \$OLD/* \$SHARED/uploads/ 2>/dev/null || true
            fi

            # Fix STORAGE_PATH to use the symlink (relative to app root)
            sed -i \"s|^STORAGE_PATH=.*|STORAGE_PATH=./storage|\" $BASE/config/.env

            # Run seed (idempotent: fills missing data, never overwrites admin changes)
            node dist/cli.js seed 2>&1 | tail -20
          "

          # 4. Atomic symlink swap (current -> new version)
          ssh $P $R "ln -sfn $BASE/versions/$VER $BASE/current"

          # 5. Update .htaccess startup file to match flat release structure
          ssh $P $R "
            H=~/domains/$DOMAIN/public_html/.htaccess
            grep -q 'PassengerStartupFile dist/main.js' \$H 2>/dev/null ||
            sed -i 's|PassengerStartupFile .*|PassengerStartupFile dist/main.js|' \$H
          "

          # 6. Restart Passenger
          ssh $P $R "touch $BASE/current/nodejs/tmp/restart.txt"

          # 7. Cleanup old versions (keep last 3)
          ssh $P $R "cd $BASE/versions && ls -1t | tail -n +4 | xargs rm -rf 2>/dev/null || true"

      - name: Deploy Web
        env:
          R: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          P: -p ${{ secrets.SSH_PORT || 65002 }}
          DOMAIN: fatanpurbazaar.com
        run: |
          BASE="~/domains/$DOMAIN/hbuilds"
          VER="deploy-$(date +%Y%m%d-%H%M%S)"

          # 1. Create new version directory
          ssh $P $R "mkdir -p $BASE/versions/$VER/nodejs/tmp"

          # 2. Upload release files (web includes node_modules — no install needed)
          rsync -az --delete --exclude tmp -e "ssh $P" web-standalone/ "$R:$BASE/versions/$VER/nodejs/"

          # 3. Setup .env symlink
          ssh $P $R "
            cd $BASE/versions/$VER/nodejs
            ln -sf $BASE/config/.env .env
            mkdir -p tmp
          "

          # 4. Atomic symlink swap
          ssh $P $R "ln -sfn $BASE/versions/$VER $BASE/current"

          # 5. Update .htaccess startup file to match flat release structure
          ssh $P $R "
            H=~/domains/$DOMAIN/public_html/.htaccess
            grep -q 'PassengerStartupFile server.js' \$H 2>/dev/null ||
            sed -i 's|PassengerStartupFile .*|PassengerStartupFile server.js|' \$H
          "

          # 6. Restart Passenger
          ssh $P $R "touch $BASE/current/nodejs/tmp/restart.txt"

          # 7. Cleanup old versions (keep last 3)
          ssh $P $R "cd $BASE/versions && ls -1t | tail -n +4 | xargs rm -rf 2>/dev/null || true"

      - name: Smoke check
        env:
          R: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          P: -p ${{ secrets.SSH_PORT || 65002 }}
        run: |
          sleep 12
          # Hit the API via the server itself (triggers Passenger spawn)
          ssh $P $R "curl -fsS http://localhost:3000/v1/catalog/home > /dev/null 2>&1 || true"
          sleep 5
          curl -fsS https://api.fatanpurbazaar.com/v1/catalog/home | head -c 100
          echo ""
          curl -fsSI https://fatanpurbazaar.com | head -1
