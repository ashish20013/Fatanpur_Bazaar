# Project-wide Gradle settings

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# Use AndroidX
android.useAndroidX=true

# ⚠️ android.enableJetifier HATA DIYA GAYA hai. Wo purani support-library wali third-party
# libraries ko AndroidX me badalta tha; is app ki koi library aisi nahi hai. AGP 8 me ye
# sirf build dheema karta tha aur AGP 9 me ise hata diya gaya hai.

# Kaun kaun si CPU ke liye build ho. Play par AAB upload karne par Google khud har phone ko
# usi ka hissa bhejta hai, isliye chaaron rakhna theek hai.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# ⚠️ New Architecture jaan-boojhkar BAND hai.
# RN 0.81 aakhri version hai jisme purani (legacy) architecture chalti hai. Is app me
# react-native-geolocation-service lagi hai jo 2021 se update nahi hui — New Arch par uska
# vyavhaar test nahi kiya gaya. Play ke liye jo chahiye tha (API 36 + 16 KB page size) wo
# legacy arch par bhi pura ho jaata hai, to risk lene ki zaroorat nahi.
# Aage RN 0.82+ par jaana ho to pehle geolocation-service badalni padegi.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# ⚠️ Android 16 (API 36) par edge-to-edge zabardasti laागू hota hai — app system bar ke
# peeche draw karta hai. `false` rakhne par RN 0.81 khud compatibility mode laga deta hai,
# jisse mojooda layout (56px header, 58px bottom nav) waisa hi dikhta hai. Ise `true` karne
# se pehle har screen ka padding dobara dekhna padega.
edgeToEdgeEnabled=false
