apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config — loads .env into BuildConfig
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * Release signing — reads from keystore.properties (git-ignored) if present.
 * To set up:
 *   1. keytool -genkeypair -v -storetype PKCS12 -keystore fatanpur-release.keystore \
 *        -alias fatanpur -keyalg RSA -keysize 2048 -validity 10000
 *   2. Move fatanpur-release.keystore into android/app/
 *   3. Create android/keystore.properties:
 *        FB_RELEASE_STORE_FILE=fatanpur-release.keystore
 *        FB_RELEASE_KEY_ALIAS=fatanpur
 *        FB_RELEASE_STORE_PASSWORD=<your password>
 *        FB_RELEASE_KEY_PASSWORD=<your password>
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

react {
    // RN 0.76+ — Hermes is always on via the react plugin.
    // No manual hermesEnabled flag needed.
}

android {
    namespace "com.fatanpurbazaar.app"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.fatanpurbazaar.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // react-native-config: makes .env vars available in BuildConfig
        resValue "string", "build_config_package", "com.fatanpurbazaar.app"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['FB_RELEASE_STORE_FILE'] ?: 'fatanpur-release.keystore')
                storePassword keystoreProperties['FB_RELEASE_STORE_PASSWORD'] ?: ''
                keyAlias keystoreProperties['FB_RELEASE_KEY_ALIAS'] ?: 'fatanpur'
                keyPassword keystoreProperties['FB_RELEASE_KEY_PASSWORD'] ?: ''
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // React Native (from node_modules)
    implementation("com.facebook.react:react-android")
    // RN 0.76+ with react plugin — Hermes is always bundled, no conditional needed (M10 FIX)
    implementation("com.facebook.react:hermes-android")

    // AndroidX core (for NotificationCompat in FGLocationService)
    implementation("androidx.core:core-ktx:1.15.0")
}

// Firebase — must be at the very bottom
apply plugin: "com.google.gms.google-services"
